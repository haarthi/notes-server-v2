[project]
name = "notes-mcp"
version = "0.2.0"
description = "Personal notes MCP server — markdown source of truth, exposed to claude.ai via OAuth + tunnel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.2",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "python-multipart>=0.0.9",
]

[project.scripts]
notes-mcp = "notes_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
